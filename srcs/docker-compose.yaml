services :
  nginx :
    ports :
      - "443:443"
    build : ./nginx
    volumes:
    - wordpress_data:/var/www/html
    depends_on:
      - wordpress
    networks :
      - inception

  mariadb :
    build : ./mariadb
    env_file: .env
    volumes :
      - mariadb_data:/var/lib/mysql
    networks :
      - inception

  wordpress :
    build : ./wordpress
    env_file: .env
    volumes :
      - wordpress_data:/var/www/html
    networks : 
      - inception

volumes :
  wordpress_data:
  mariadb_data:

networks :
  inception :
    driver : bridge
