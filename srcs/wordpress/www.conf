[www]
; The user and group that PHP-FPM workers run as
; www-data is the standard web server user on debian
user  = www-data
group = www-data

; THIS IS CRITICAL for Docker
; By default PHP-FPM listens on a unix socket (a file on disk)
; Unix sockets only work between processes on the SAME machine
; Since Nginx is in a DIFFERENT container, it can't reach a socket file
; So we listen on a TCP port instead — any container on the network can reach it
listen = 9000

; How PHP-FPM manages worker processes
; dynamic = it scales up and down based on load
pm = dynamic

; Maximum number of PHP worker processes allowed
pm.max_children = 5

; How many workers to start when PHP-FPM starts
pm.start_servers = 2

; Minimum workers kept alive when idle
pm.min_spare_servers = 1

; Maximum workers kept alive when idle
pm.max_spare_servers = 3
